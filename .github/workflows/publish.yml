name: Publish to npm

# Manual / recovery entry point ONLY. Automatic publishing on a `v*` tag push
# lives in `build-binaries.yml`'s `publish-npm` job, which is ordered with the
# binaries, the GitHub release, and the release announcement. Adding a `push`
# trigger here would create a second tag-driven publish path that races the
# announcement.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.85.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to publish from (defaults to tag)'
        required: false
        type: string
      dry_run:
        description: 'Dry run: list packages without publishing'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag }}
    strategy:
      # One package missing its trusted-publisher entry must not stop the rest.
      fail-fast: false
      matrix:
        package:
          - { name: '@bramburn/qi-ai', dir: packages/ai }
          - { name: '@bramburn/qi-tui', dir: packages/tui }
          - { name: '@bramburn/qi-telemetry', dir: packages/telemetry }
          - { name: '@bramburn/qi-protocol', dir: packages/protocol }
          - { name: '@bramburn/qi-client', dir: packages/client }
          - { name: '@bramburn/qi-agent-core', dir: packages/agent }
          - { name: '@bramburn/qi-session-backend-sqlite-node', dir: packages/session-backends/sqlite-node }
          - { name: '@bramburn/qi-coding-agent', dir: packages/coding-agent }
          - { name: '@bramburn/qi-server', dir: packages/server }
          - { name: '@bramburn/qi-clipboard-rs', dir: packages/clipboard-rs }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # Same rationale as ci.yml / build-binaries.yml: `bun install` (not
        # `npm ci --ignore-scripts`) so platform-specific optional deps
        # (e.g. `@mariozechner/clipboard-*`) install on linux-x64 runners.
        # `--linker=hoisted` matches those workflows so transitive deps
        # resolve at the conventional `node_modules/<scope>/<name>` paths.
        run: bun install --ignore-scripts --linker=hoisted

      - name: Build
        run: bun run build

      - name: Upgrade npm for trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1; pin the same version
        # build-binaries.yml uses so provenance/auth behavior matches.
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: List public workspace packages (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          node --input-type=module -e "
          import { getPublicWorkspacePackages } from './scripts/release-packages.mjs';
          for (const pkg of getPublicWorkspacePackages()) {
            console.log(pkg.name + '@' + pkg.version);
          }
          "

      - name: Publish ${{ matrix.package.name }}
        # scripts/publish-with-skip.mjs is idempotent: a version already on npm
        # logs 'version already on npm, treating as success (idempotent)' and
        # exits 0. A missing trusted-publisher entry surfaces as ENEEDAUTH and
        # fails this step. See AGENTS.md 'npm trusted publisher setup'.
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-with-skip.mjs ${{ matrix.package.dir }} npm publish --access public --tag fork