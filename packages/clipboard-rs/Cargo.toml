[package]
# Cargo's package name rules forbid `@` and `/`. The npm-distribution
# name (`@bramburn/qi-clipboard-rs`) lives in `package.json`; the napi-rs
# CLI reads that field for the .node filename, not this one. Keep this
# bare crate name.
name        = "pi-clipboard-rs"
# Crate version. This MUST match the `version` field in package.json;
# build.rs fails the build when the two disagree. Automatic sync via the
# release script is a pending, separate change.
version = "0.85.0-b1"
edition     = "2021"
rust-version = "1.77"
description = "Fork-local cross-platform clipboard native addon for pi-coding-agent. Replaces @mariozechner/clipboard."
license     = "MIT"
repository  = "https://github.com/bramburn/qi"
publish     = false

[lib]
# napi-rs expects a `lib` target. The name is what becomes the .node
# file's internal Rust symbol; the .node filename comes from the
# package.json `name` field.
name = "pi_clipboard_rs"
crate-type = ["cdylib"]

[dependencies]
# Pure-Rust cross-platform clipboard. arboard talks to X11/Wayland on Linux,
# NSPasteboard on macOS, and the Win32 clipboard on Windows. We pin to a
# specific major version; the API surface is small (get/set text, optional
# image) and a major bump will require touching src/lib.rs.
arboard = "3.4"

# napi-rs turns Rust functions into Node addon exports. The version pin
# matches @napi-rs/cli in package.json devDependencies. `async` enables
# the `#[napi] async fn` runtime (transitively pulls in tokio_rt).
# `napi6` is the Node N-API version floor.
napi        = { version = "3.0", features = ["napi6", "async"] }
napi-derive = "3.0"

# PNG encoder for the image path. arboard hands back raw RGBA pixels;
# we wrap them in image::ImageBuffer and emit a PNG byte stream. We
# disable default features so we don't pull in JPEG/GIF/WebP/TIFF
# decoders — the native addon only ever produces PNGs, the rest is
# dead weight in the .node binary.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# napi-build generates the C headers napi-rs needs. The pairing here is
# `napi 3.0` runtime + `napi-build 2.4+` build helper (Cargo.lock resolves
# 2.6.0), matching the `@napi-rs/cli 3.5.0` devDependency in package.json
# and the toolchain pinned in .github/workflows/clipboard-rs-build.yml.
# See https://docs.rs/napi-build for the version matrix.
napi-build = "2.4"

# build.rs parses package.json to compare its `version` against the
# Cargo package version. Desktop-only dependency; never linked into the
# .node binary.
serde_json = "1"


[features]
# Default build: link the dynamic libstd so the .node is small and uses the
# system std. Set `RUSTFLAGS="-C prefer-dynamic"` if your platform needs
# static libstd (Windows MSVC by default).
default = []
